{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Create' }} Event | EventFlow{% endblock %}
{% block content %}
<section class="card form-card wide-form">
    <h1>{{ 'Edit' if event else 'Create' }} event</h1>
    <form method="post">
        <label>Title<input name="title" value="{{ event.title if event else '' }}" required></label>
        <label>Category
            <select name="category">
                {% for category in categories %}
                    <option value="{{ category }}" {% if event and event.category == category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Or type your own category<input name="custom_category" placeholder="Example: Fashion"></label>
        <label>Description<textarea name="description" rows="4">{{ event.description if event else '' }}</textarea></label>
        <label>Date and time<input type="datetime-local" name="date_time" value="{{ event.date_time if event else '' }}" required></label>
        <label>Location
            <input name="location" value="{{ event.location if event else '' }}" placeholder="Accra, Ghana" required>
            <small>Use a city and country so the weather service can find it.</small>
        </label>
        <div class="two-columns">
            <label>Capacity<input type="number" name="capacity" min="1" value="{{ event.capacity if event else 1 }}" required></label>
            <label>Price (GHS)<input type="number" name="price" min="0" step="0.01" value="{{ event.price if event else 0 }}" required></label>
        </div>
        <label>Send reminder before event
            <select name="reminder_hours">
                {% for hours, label in [(1, '1 hour'), (6, '6 hours'), (12, '12 hours'), (24, '1 day'), (48, '2 days'), (168, '1 week')] %}
                    <option value="{{ hours }}" {% if event and event.reminder_hours == hours %}selected{% elif not event and hours == 24 %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        {% if event %}
            <label>Status
                <select name="status">
                    {% for status in ['upcoming', 'ongoing', 'completed', 'cancelled'] %}
                        <option value="{{ status }}" {% if event.status == status %}selected{% endif %}>{{ status.title() }}</option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}
        <button type="submit">Save event</button>
    </form>
</section>
{% endblock %}
